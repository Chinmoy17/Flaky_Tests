# Run NonDex/iDFlakies targets reproducibly via Docker Compose, straight from the VS Code terminal.
#
#   docker compose --profile gson       up   # NonDex on google/gson
#   docker compose --profile fastjson2  up   # NonDex on alibaba/fastjson2
#   docker compose --profile http-request up # iDFlakies on kevinsawicki/http-request
#
# Each target is a profile so they run one at a time (safe shared Maven cache).
# Results are written to ./results/<tool>/<project>/. A non-zero exit is EXPECTED
# when the tool finds flaky tests.
name: flaky-tests

x-nondex-common: &nondex-common
  build: ./docker/nondex
  image: flaky-nondex
  volumes:
    - ./results/nondex:/out          # findings land here
    - m2cache:/root/.m2              # cache Maven downloads across runs

x-idflakies-common: &idflakies-common
  build: ./docker/idflakies
  image: flaky-idflakies
  volumes:
    - ./results/idflakies:/out       # findings land here
    - m2cache:/root/.m2              # cache Maven downloads across runs

services:
  gson:
    <<: *nondex-common
    profiles: ["gson"]
    command:
      - "https://github.com/google/gson.git"
      - "e685705b2bf3ae174958612a185bd231c0e0c5d9"
      - "gson"
      - "MapTest,FieldNamingTest,CollectionTest"

  fastjson2:
    <<: *nondex-common
    profiles: ["fastjson2"]
    command:
      - "https://github.com/alibaba/fastjson2.git"
      - "450d9fe5a39f9f911f06882a302a585b93a586fa"
      - "core"
      - "MapSortFieldTest,ObjectWriterSetTest,Issue507,Issue586,Issue1494"

  http-request:
    <<: *idflakies-common
    profiles: ["http-request"]
    command:
      - "https://github.com/kevinsawicki/http-request.git"
      - "2d62a3e9da726942a93cf16b6e91c0187e6c0136"
      - "lib"
      - "10"
      - "random-class-method"

volumes:
  m2cache:
